name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            testbench: "^9.0"
            pest: "^3.8"
            pest-laravel: "^3.2"
          - php: "8.3"
            testbench: "^10.0"
            pest: "^4.0"
            pest-laravel: "^4.0"
          - php: "8.4"
            testbench: "^11.0"
            pest: "^5.0"
            pest-laravel: "^5.0"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest-laravel }}" --no-interaction --no-progress --with-all-dependencies
      - run: composer test
